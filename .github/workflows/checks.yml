# .github/workflows/checks.yml
#
# Every push of a branch: the package builds and its tests pass. A pushed
# version tag does not run them again — it names a commit its branch
# already checked, and publish.yml runs the tests itself before staging.
# The audit is not run here either — whether a dependency is current
# changes with what others publish, not with this push; it gates the
# release (publish.yml).

name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci
      - run: npm test
